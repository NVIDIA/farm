[tool.poetry.scripts]

# Runs all of Farm services including Controller
farm = "nv.svc.farm.standalone:run_all_farm_services"

# Only the API Services (no Controller)
farm-api = "nv.svc.farm.standalone:run_api_farm_services"

agents-svc = "nv.svc.farm.services.agents.entrypoint:main"
capacity-svc = "nv.svc.farm.services.capacity.entrypoint:main"
controller-svc = "nv.svc.farm.services.controller.entrypoint:main"
dashboard-svc = "nv.svc.farm.services.dashboard.entrypoint:main"
jobs-svc = "nv.svc.farm.services.jobs.entrypoint:main"
logs-svc = "nv.svc.farm.services.logs.entrypoint:main"
results-svc = "nv.svc.farm.services.results.entrypoint:main"
retries-svc = "nv.svc.farm.services.retries.entrypoint:main"
settings-svc = "nv.svc.farm.services.settings.entrypoint:main"
tasks-svc = "nv.svc.farm.services.tasks.entrypoint:main"
dag-svc = "nv.svc.farm.services.dag.entrypoint:main"

[tool.poetry]
name = "nv.svc.farm"
version = "1.1.3"
description = "Farm Microservices Mono-repo"
authors = ["NVIDIA Corporation"]
license = "Proprietary"
readme = "README.md"
packages = [
    { include = "nv/svc" },
]
include = [
    { path = "CHANGELOG.md", format = "sdist"},
    { path = "LICENSE.txt", format = "sdist"},
    { path = "SECURITY.md", format = "sdist"},
    { path = "tests", format = "sdist" },
    # vendored nv.svc data needed at runtime
    { path = "nv/svc/core/config", format = ["sdist", "wheel"] },
    { path = "nv/svc/server/http/config", format = ["sdist", "wheel"] },
    { path = "nv/svc/kubernetes/client/config", format = ["sdist", "wheel"] },
    { path = "nv/svc/facilities/monitoring/metrics/config", format = ["sdist", "wheel"] },
    # existing farm config and dashboard build
    { path = "nv/svc/farm/config", format = "sdist" },
    { path = "nv/svc/farm/services/dashboard/build/**/*", format = ["sdist", "wheel"] },
]
keywords = ["nv", "svc", "farm"]
classifiers = [
    "Topic :: Utilities",
]

[tool.poetry.dependencies]
python = ">=3.10.1,<4.0.0"
# Replaced internal nv-svc packages with public equivalents required by vendored code
fastapi = "^0.115.0"
starlette = "^0.40.0"
uvicorn = "^0.30.0"
aiohttp = "^3.10.0"
asgi-correlation-id = "^4.3.1"
dynaconf = "^3.2.6"
tabulate = "^0.9.0"
prometheus-client = "^0.21.0"
opentelemetry-sdk = "^1.25.0"
opentelemetry-api = "^1.25.0"
opentelemetry-exporter-otlp-proto-grpc = "^1.25.0"
kubernetes-asyncio = "^29.0.0"
grpcio = "^1.66.0"
grpc-interceptor = "^0.15.4"
uvloop = {version = "^0.20.0", markers = "platform_system != \"Windows\""}

# logs service dependencies
elasticsearch = "^8.17.2"
opensearch-py = "2.7.1"

# jobs service dependencies
psutil = "6.0.0"
watchdog = "4.0.2"
toml = "0.10.2"
redis= "5.0.8"

# tasks service dependencies
databases = "0.9.0"
aiosqlite = "0.20.0"
aiomysql = "0.2.0"

# capacity service dependencies
pynvml = "11.5.3"

# docker manager
aiodocker = "0.22.2"
platformdirs = "4.3.6"
networkx = "^3.4.2"

[tool.poetry.group.dev.dependencies]
bandit = "^1.7.7"
coverage = "^7.4.0"
flake8 = "^7.0.0"
flake8-bugbear = "^24.1.17"
flake8-docstrings = "^1.7.0"
flake8-pyproject = "^1.2.3"
flake8-typing-imports = "^1.15.0"
pylint = "^3.0.3"
pytest = "^7.4.4"
pytest-mock = "^3.12.0"
isort = "^5.13.2"
black = "^24.1.1"
mypy-extensions = "^1.0.0"

[tool.poetry.group.docs.dependencies]
mkdocs-techdocs-core = "^1.3.5"
mkdocs-gen-files = "^0.5.0"
mkdocs-literate-nav = "^0.6.1"
mkdocstrings = {version = "^0.24.1", extras = ["python"]}
mdx-include = "^1.4.2"
mypy-extensions = "^1.0.0"
griffe = "0.48.0"
click = ">=7.0"
colorama = {version = ">=0.4", markers = "platform_system == \"Windows\""}
ghp-import = ">=1.0"
jinja2 = ">=2.11.1"
markdown = ">=3.3.6"
markupsafe = ">=2.0.1"
mergedeep = ">=1.3.4"
mkdocs-get-deps = ">=0.2.0"
packaging = ">=20.5"
pathspec = ">=0.11.1"
pyyaml = ">=5.1"
pyyaml-env-tag = ">=0.1"
watchdog = ">=2.0"

[tool.poetry.group.test.dependencies]
httpx = "^0.26.0"
requests = "^2.31.0"
asyncpg = "0.29.0"
testcontainers = "^4.0.0"

[tool.bandit]
exclude_dirs = ["tests", ".tox", ".venv"]

[tool.flake8]
# TODO: address missing docstrings.
ignore = [
    "D202", # No blank lines allowed after function docstring
    "E203", # whitespace before ':'
    "B008", # Do not perform function calls in argument defaults
    "D102", # Missing docstring in public method
    "D107", # Missing docstring in __init__
]
exclude = ["tests", "docs", ".tox", ".venv", ".history", "__init__.py", "node_modules"]
max-line-length = 160
min_python_version = "3.10.1"

[tool.pylint.FORMAT]
max-line-length = 160

[tool.pylint.'MESSAGES CONTROL']
disable = [
    "W0511",  # TODO
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
src_paths = ["nv", "tests"]

[tool.black]
line-length = 160
target-version = ["py310"]
