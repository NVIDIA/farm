name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (e.g., 1.0.0)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  determine-version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Extract version from input
        id: version
        run: echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT

  backend:
    name: Backend
    needs: determine-version
    uses: ./.github/workflows/_python.yaml

  frontend:
    name: Frontend
    needs: determine-version
    uses: ./.github/workflows/_frontend.yaml

  docker-build:
    name: Docker Build
    needs: determine-version
    uses: ./.github/workflows/_docker.yaml

  helm-validate:
    name: Helm Validate
    needs: determine-version
    uses: ./.github/workflows/_helm.yaml

  e2e:
    name: E2E
    needs: [backend, frontend, docker-build, helm-validate]
    uses: ./.github/workflows/_e2e.yaml

  publish-docker:
    name: Publish Docker
    needs: [e2e, determine-version]
    uses: ./.github/workflows/_docker-publish.yaml
    with:
      version: ${{ needs.determine-version.outputs.version }}
    secrets: inherit

  publish-helm:
    name: Publish Helm
    needs: [e2e, determine-version]
    uses: ./.github/workflows/_helm-publish.yaml
    with:
      version: ${{ needs.determine-version.outputs.version }}
    secrets: inherit
