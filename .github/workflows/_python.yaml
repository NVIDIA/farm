name: Python

on:
  workflow_call:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --with dev

      # TODO: Enable formatting checks after applying fixes in a separate PR
      # - name: Check formatting (black)
      #   run: poetry run black --check --diff nv/svc/farm/ tests/

      # - name: Check imports (isort)
      #   run: poetry run isort --check --diff nv/svc/farm/ tests/

      - name: Lint (flake8)
        run: poetry run flake8

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run tests
        run: poetry run pytest -s -vv tests/
