name: Docker Publish

on:
  workflow_call:
    inputs:
      version:
        description: Release version (e.g., 1.0.0)
        required: true
        type: string
      registry:
        description: Container registry
        type: string
        default: ghcr.io
      image_name:
        description: Image name
        type: string
        default: ${{ github.repository }}

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load and tag image
        env:
          REGISTRY: ${{ inputs.registry }}
          IMAGE_NAME: ${{ inputs.image_name }}
          VERSION: ${{ inputs.version }}
        run: |
          docker load -i farm-image.tar
          LOADED_IMAGE=$(docker images --format "{{.Repository}}:{{.Tag}}" | head -1)
          MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1,2)
          docker tag "$LOADED_IMAGE" "$REGISTRY/$IMAGE_NAME:$VERSION"
          docker tag "$LOADED_IMAGE" "$REGISTRY/$IMAGE_NAME:$MAJOR_MINOR"

      - name: Push image
        env:
          REGISTRY: ${{ inputs.registry }}
          IMAGE_NAME: ${{ inputs.image_name }}
          VERSION: ${{ inputs.version }}
        run: |
          MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1,2)
          docker push "$REGISTRY/$IMAGE_NAME:$VERSION"
          docker push "$REGISTRY/$IMAGE_NAME:$MAJOR_MINOR"
