name: Helm

on:
  workflow_call:
    inputs:
      chart_path:
        description: Path to Helm chart
        type: string
        default: helm/nv.svc.farm

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint ${{ inputs.chart_path }}

      - name: Template chart
        run: |
          helm template farm ${{ inputs.chart_path }} \
            --set external.mysql.enabled=true \
            --set external.mysql.host=mysql.example.com \
            --set external.redis.enabled=true \
            --set external.redis.host=redis.example.com \
            > /dev/null
