name: Helm Publish

on:
  workflow_call:
    inputs:
      version:
        description: Release version (e.g., 1.0.0)
        required: true
        type: string
      chart_path:
        description: Path to Helm chart
        type: string
        default: helm/nv.svc.farm

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Update chart version
        run: |
          sed -i "s/^version: .*/version: ${{ inputs.version }}/" ${{ inputs.chart_path }}/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${{ inputs.version }}\"/" ${{ inputs.chart_path }}/Chart.yaml

      - name: Package chart
        run: helm package ${{ inputs.chart_path }}

      - name: Push chart to registry
        run: helm push nv-svc-farm-*.tgz oci://ghcr.io/${GITHUB_REPOSITORY,,}
